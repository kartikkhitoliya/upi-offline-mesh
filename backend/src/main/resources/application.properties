# Server
server.port=${SERVER_PORT:8080}

# Database
# Defaults to an in-memory H2 database so the project runs with zero setup.
# To point it at Postgres instead, set these environment variables before
# starting the app (do NOT hardcode real credentials here):
#   DB_URL=jdbc:postgresql://<host>:<port>/<database>
#   DB_DRIVER=org.postgresql.Driver
#   DB_USERNAME=<username>
#   DB_PASSWORD=<password>
spring.datasource.url=${DB_URL:jdbc:h2:mem:upimesh}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console - only meaningful while using the default H2 database.
# Leave disabled if you switch to Postgres or deploy anywhere public.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# UPI Configuration
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
